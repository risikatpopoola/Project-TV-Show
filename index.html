<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TV Show Project | Rizqah Popoola (risikatpopoola)</title>
    <link href="style.css" rel="stylesheet" />
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
  </head>

  <body>
    <input type="text" id="search-input" placeholder="Search episodes..." />

    <label for="episode-selector">Choose an episode:</label>
    <select id="episode-selector"></select>
    <button id="show-all-button">Show All Episodes</button>

    <p id="episode-count"></p>

    <main id="root"></main>

    <template id="episode-card">
      <section>
        <h3>Episode title</h3>
        <img id="episode-image" alt="" />
        <summary>This is a story of love</summary>
      </section>
    </template>

    <!-- Loads YOUR javascript code -->
    <script src="script.js"></script>
  </body>
</html>
